name: OSSign Action
description: Sign files using the ossign tool or install ossign for later use
author: OSSign

branding:
  icon: feather
  color: green

inputs:
  token:
    description: 'Optional GitHub token. The latest OSSign release is resolved without a token by default; supply one only to use the authenticated API instead.'
    required: false
    default: ''
  
  trustedSigning:
    description: 'Enable OSSign Trusted Signing (OSSign Server)'
    default: false
    required: false
  
  trustedSigningServer:
    description: 'The URL of the OSSign Server to use for trusted signing (OSSign Server)'
    required: false
    default: 'https://signer.ossign.org'
  
  trustedSigningKey:
    description: 'The key to use for OSSign Trusted Signing (OSSign Server)'
    required: false
    default: ''
  
  trustedSigningTimestamper:
    description: 'The timestamper to use for OSSign Trusted Signing (OSSign Server)'
    required: false
    default: 'http://timestamp.acs.microsoft.com/tsa/advanced'
  
  trustedSigningMsTimestamper:
    description: 'The Microsoft timestamper to use for OSSign Trusted Signing (OSSign Server)'
    required: false
    default: 'http://timestamp.acs.microsoft.com/tsa'

  installOnly:
    description: 'If true, only install ossign and config, do not sign any files'
    required: false
    default: 'false'
  
  config:
    description: 'The configuration for ossign (JSON)'
    required: false
    default: ''
  
  inputFiles:
    description: 'The files to sign (supports glob patterns)'
    required: false

  inputFile:
    description: 'The file to sign'
    required: false

  outputFile:
    description: 'Where to write the signed file. Default: sign in place, overwriting the input.'
    required: false

  fileType:
    description: 'The type of file to sign (ps, pecoff, msi, dmg, appxmanifest, jar, apk)'
    required: true
    default: 'pecoff'

outputs:
  ossignPath:
    description: 'The path to the ossign binary'
  configPath:
    description: 'The path to the config file used'
  signedFile:
    description: 'The path to the signed file (if applicable)'

runs:
  using: node24
  main: action/dist/index.js
