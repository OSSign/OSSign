name: Build and Publish Packages

on:
  push:
    tags: ["*.*.*"]


jobs:
  build:
    permissions:
      contents: write
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - id: go
      name: Install go
      uses: actions/setup-go@v5
      with:
        go-version: 1.27.2
        cache-dependency-path: go.mod
    
    - name: Setup OSSign
      uses: ossign/ossign@main
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        installOnly: true
        trustedSigning: true
        trustedSigningKey: evcode
    
    - name: Create custom ID Token for publishing
      run: |
        set -euo pipefail
        ID_TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fpkg.osshield.eu" | jq -r .value)
        echo "::add-mask::$ID_TOKEN"
        TOKEN=$(curl -sSf -X POST -H "Authorization: Bearer $ID_TOKEN" \
          https://pkg.osshield.eu/api/v1/auth/github/exchange | jq -r .token)
        if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then echo "token exchange returned no token" >&2; exit 1; fi
        echo "::add-mask::$TOKEN"
        echo "REPO_TOKEN=$TOKEN" >> "$GITHUB_ENV"

    - name: Goreleaser
      uses: goreleaser/goreleaser-action@v6
      if: ${{ github.ref_name != 'main' }}
      with:
        version: ${{ github.event.release.tag.name }}
        args: release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO_TOKEN: ${{ env.REPO_TOKEN }}
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release
        path: dist/**

