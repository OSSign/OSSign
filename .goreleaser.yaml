version: 2

builds:
  - id: linux
    main: ./cmd/
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  
  - id: darwin
    main: ./cmd/
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
  
  - id: windows
    main: ./cmd/
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [ tar.gz, binary ]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [ zip, binary ]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

nfpms:
  - id: linux-nfpms
    package_name: "ossign"
    description: "ossign - A code signing tool"
    vendor: "OSSign"
    maintainer: OSSign <contact@ossign.org>
    file_name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}amd64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    formats:
      - deb
      - apk
      - rpm
    bindir: /usr/local/bin

binary_signs:
  - id: ossign
    ids:
      - windows
    cmd: ossign
    signature: "${artifact}"
    args:
      - "-o"
      - ${artifact}
      - "-t"
      - "pecoff"
      - ${artifact}

notarize:
  macos:
    - enabled: false
      ids:
        - darwin
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
        entitlements: ./entitlements.plist
      
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

release:
  github:
    owner: ossign
    name: ossign

uploads:
  - name: "debian"
    ids: ["linux-nfpms"]
    method: "PUT"
    exts:
      - deb
    mode: archive
    target: https://deb.ossign.org/upload?dist=all&component=main
    custom_artifact_name: true
    custom_headers:
      Authorization: "Bearer {{ .Env.REPO_TOKEN }}"
  
  - name: "alpine"
    method: "PUT"
    ids: ["linux-nfpms"]
    exts:
      - apk
    mode: archive
    target: https://alpine.ossign.org/upload?repo=all
    custom_artifact_name: true
    custom_headers:
      Authorization: "Bearer {{ .Env.REPO_TOKEN }}"
  
  - name: "rpm"
    method: "PUT"
    ids: ["linux-nfpms"]
    exts:
      - rpm
    mode: archive
    target: https://rpm.ossign.org/upload?repo=all
    custom_artifact_name: true
    custom_headers:
      Authorization: "Bearer {{ .Env.REPO_TOKEN }}"
